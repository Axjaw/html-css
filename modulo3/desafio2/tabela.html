<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
        * {
            padding: 0px;
            margin: 0 auto;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-collapse: collapse;
        }

        th {
            padding: 15px;
            border-collapse: collapse;
            border: 1px solid black;
        }

        th {
            background-color: rgb(119, 119, 119);
            color: white;
        }
        
        td {
            border-collapse: collapse;
            border: 1px solid black;
            padding: 15px;
        }

        td#exat {
            font-weight: bolder;
        }

        td#med {
            background-color: rgb(119, 119, 119);
            color: white;
            font-weight: bolder;
        }

        h1 {
            text-align: center;
            font-weight: bolder;
            font-size: 2em;
            padding: 0px;
            margin: 2px;
        }

        .rox {
            background-color: violet;
        }

        .black {
            background-color: rgb(253, 108, 108);
            font-weight: bolder;
        }
    </style>
</head>
<body>
    <table>
        <colgroup>
            <col class="rox">
            <col class="black">
        </colgroup>
        <caption>
            <h1>Boletim Escolar</h1>
        </caption>
        <thead>
            <tr>
                <th rowspan="2" scope="col">Área</th>
                <th rowspan="2" scope="col">Disciplinas</th>
                <th colspan="2" scope="colgroup">Notas</th>
                <th rowspan="2">Média</th>
            </tr>
            <tr>
                <th scope="col">Nota 1</th>
                <th scope="col">Nota 2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="4" id="exat" scope="rowgroup">Exatas</td>
                <td scope="row">Matemática</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td scope="row">Física</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td scope="row">Química</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td scope="row">Biologia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td colspan="4" id="med" scope="row">Média de exatas</td>
                <td id="med">0.0</td>
            </tr>
            <tr>
                <td rowspan="2" id="exat" scope="rowgroup">Humanas</td>
                <td>História</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td scope scope="row">Geografia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td colspan="4" id="med" scope="row">Média de Humanas</td>
                <td id="med">0.0</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
