<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Vídeos com HTML5</title>
    <style>

        body {
            background-color: rgb(0, 0, 0);
        }
        h1, h2, h3, h4, p {
            text-align: center;
            color: rgb(0, 255, 255);
        }
        markee {

            background-color: rgb(255, 0, 0);
            color: rgb(255, 255, 255);
        }

    </style>
</head>
<body>
    <h1>Inserindo vídeos hospedados localmente</h1>
    <p>Este vídeo está hospedado no meu próprio servidor</p>
    <div style="text-align:center;">
    <video id="meuvideo" width="350" poster="imagens/81be450cf486ea13d5ac203bc6abb306.jpg" controls center>
        <source src="midia/shopeead.mp4" type="video/mp4">
        <source src="midia/Shopeead.webm" type="video/webm">
        <p>Seu navegador não tem compatibilidade com reprodução de vídeos.</p>
    </video>
    <script>
        const video = document.getElementById('meuvideo')
        video.volume=0.20;
    </script>
</div>
<h1>Inserindo vídeos do <markee> YouTube </markee></h1>
    <div style="text-align:center;">
<iframe width="560" height="315" src="https://www.youtube.com/embed/V9GvXiK0ytE?si=AKbpfnGDfVTYq0p6&amp;start=2" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</div>
</body>
</html>
