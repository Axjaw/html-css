<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <STYLE>
        div.container {
            background-color: rgb(0, 0, 0);
            height: 400px;
            display: flex;
            flex-flow: row wrap;
            align-content: space-evenly;

        div.item {
            background-color: rgb(207, 140, 216);
            border: 1px solid black;
            text-align: center;
            padding: 40px;
        }

</head>
