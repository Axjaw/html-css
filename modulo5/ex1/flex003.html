<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <STYLE>
        div.container {
            background-color: 
            rgb(47, 1, 53);
            display: flex;
            justify-content: center;
            height: 300px;
            align-items: center;
        }

        div.item {
            background-color: rgb(92, 25, 86);
            border: 1px solid black;
            text-align: center;
            padding: 40px;
        }
    </STYLE>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
    </div>
</body>
</html>
