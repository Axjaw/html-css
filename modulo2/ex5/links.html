<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Links</title>
    <style>
        /*   SELETORES PERSONALIZADOS
            # = id
            . = class
            : = pseudo-class
            :: = pseudo-element
            > = children
        */

        body {
            font-family:  Arial, Helvetica, sans-serif;
        }

        a {
            color: rgb(2, 119, 139);
            text-decoration: none;
            font-weight: bold;
        }

        a:visited {
            color: rgb(0, 63, 63);
            text-decoration: none;
        }

        a:hover {
            color: black;
            text-decoration: underline;
        }

        a:active {
            color: yellow;
        }

        .especial {
            background-color: rgb(196, 113, 113);
        }

        .especial::before {
            content: '→';
        }

        .especial::after {
            content: '←';
        }
        /* PSEUDO-CLASSE = 1X USA :
        PSEUDO- ELEMENTO = 2X USA ::
        */
        video {
            width: 500px;
            align-self: center;
            margin: 0 auto;
            display: block;
        }
    </style>
</head>
<body>
    <h1>Personalizando Links</h1>
    <ul>
        <li><a href="https://github.com/gustavoguanabara/html-css/tree/master/aulas-pdf" target="_blank">Repositório Github</a></li>
        <li><a href="https://www.youtube.com/@cursoemvideo" target="_blank" class="especial">Canal do Youtube</a></li>
        <li><a href="https://www.cursoemvideo.com" target="_blank" class="especial">Site do CursoemVideo</a></li>

    </ul>
    <video controls src="renan.mp4" type="video/mp4"></video>
</body>
</html>
