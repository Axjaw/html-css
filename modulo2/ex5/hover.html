<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Exemplo de Hover</title>
    <style>
        body {
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
        }
        div:hover {
            color: red;
        }
        div > p {
            display: none;
        }
        div:hover > p {
            display: block;
            color: white;
            background-color: rgb(129, 31, 31);
            width: 80px;
            height: 37px;
        }
    </style>
</head>
<body>
    <h1>Exemplo de hover</h1f>
    <p>Passe o mouse sobre o texto abaixo</p>
    <div>
        <p>TEXTO ESCONDIDO...</p>
 Passe o mouse aqui</div>
</body>
</html>
