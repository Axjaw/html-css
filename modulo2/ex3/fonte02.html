<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Fontes Externas</title>
    <style>
        @font-face {
            font-family: 'love';
            src: url(fontes/love\ larry\ ttf.ttf
            ) format(opentype), url(fontes/love\ larry\ ttf.ttf) format(truetype);
            /*
                Tipos de format()
                - opentype (otf)
                - truetype (ttf)
                - embedded-opentype
                - tuetype-aat (Apple Advanced Typography)
                -svg
            */
            font-weight: normal;
            font-style: normal;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        h1 {
            font-family: 'love';
            font-size: 3em;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>Oi crianças!!!</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Illo dicta debitis ratione neque harum quasi inventore odio soluta accusantium. Necessitatibus quos sunt molestias ducimus veritatis sint assumenda distinctio voluptas! Nobis!</p>
</body>
</html>
